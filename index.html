<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Cancionero Pro</title>
  <style>
    :root {
      --bg: #050805;
      --panel: #0d160d;
      --panel-2: #111f11;
      --text: #d7ffd7;
      --muted: #8ccf8c;
      --accent: #00ff66;
      --accent-2: #39ff14;
      --danger: #ff5a5a;
      --warning: #ffd166;
      --border: #1d451d;
      --shadow: rgba(0, 255, 102, 0.12);
      --font-size: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: radial-gradient(circle at top, #0b250b, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(5, 8, 5, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.15rem, 4vw, 1.8rem);
      color: var(--accent);
      text-shadow: 0 0 12px var(--shadow);
    }

    .status {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 14px;
      padding: 14px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .panel {
      background: linear-gradient(180deg, var(--panel), #081008);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .panel-inner {
      padding: 14px;
    }

    label {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
      margin: 10px 0 5px;
    }

    input, textarea, select, button {
      font: inherit;
    }

    input, textarea, select {
      width: 100%;
      background: #030703;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      outline: none;
    }

    textarea {
      min-height: 330px;
      resize: vertical;
      line-height: 1.55;
      font-size: var(--font-size);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--shadow);
    }

    button {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      padding: 10px 12px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      background: #123012;
    }

    button.primary {
      color: #001f0a;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 800;
    }

    button.danger {
      border-color: #663333;
      color: #ffd9d9;
    }

    button.warning {
      color: #211600;
      background: var(--warning);
      border-color: var(--warning);
      font-weight: 800;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 10px 0;
    }

    .song-list {
      display: grid;
      gap: 8px;
      max-height: 55vh;
      overflow: auto;
      padding-right: 4px;
    }

    .song-card {
      background: #071007;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      cursor: pointer;
    }

    .song-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--shadow);
    }

    .song-title {
      color: var(--accent-2);
      font-weight: 800;
      margin-bottom: 4px;
    }

    .song-meta {
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .viewer {
      min-height: 65vh;
    }

    .preview {
      background: #030703;
      border-top: 1px solid var(--border);
      min-height: 330px;
      max-height: 67vh;
      overflow: auto;
      padding: 18px;
      line-height: 1.75;
      font-size: var(--font-size);
      white-space: pre-wrap;
      border-radius: 0 0 18px 18px;
    }

    .chord {
      color: var(--accent);
      font-weight: 900;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.22);
    }

    .section-title {
      color: var(--warning);
      font-weight: 800;
    }

    audio {
      width: 100%;
      margin-top: 8px;
    }

    .small {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .hidden {
      display: none !important;
    }

    .teleprompter-on .preview {
      max-height: calc(100vh - 220px);
    }

    .kbd {
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      border-radius: 8px;
      padding: 2px 6px;
      color: var(--accent);
      background: #020502;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .song-list {
        max-height: 260px;
      }

      .grid-3 {
        grid-template-columns: 1fr;
      }

      textarea, .preview {
        min-height: 300px;
      }
    }

    @media (max-width: 520px) {
      header {
        align-items: flex-start;
      }

      .grid-2 {
        grid-template-columns: 1fr;
      }

      .toolbar button, .toolbar select {
        flex: 1 1 auto;
      }

      :root {
        --font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🎸 Mi Cancionero Pro</h1>
      <div class="status" id="status">Listo para guardar rolas.</div>
    </div>
    <div class="toolbar">
      <button class="primary" id="btnGuardar">Guardar</button>
      <button id="btnNueva">Nueva</button>
      <button id="btnExportar">Exportar</button>
      <button id="btnImportar">Importar</button>
      <input class="hidden" id="archivoImportar" type="file" accept="application/json" />
    </div>
  </header>

  <main class="layout">
    <aside class="panel">
      <div class="panel-inner">
        <label for="busqueda">Buscar rola</label>
        <input id="busqueda" placeholder="Ej: Te Metiste, Ariel, La..." />

        <div class="toolbar">
          <button id="btnOrdenTitulo">A-Z</button>
          <button id="btnOrdenFecha">Recientes</button>
          <button class="danger" id="btnBorrar">Borrar</button>
        </div>

        <div class="song-list" id="listaCanciones"></div>

        <p class="small">
          Tip: el guardado aquí queda en este navegador. Para pasarlo a otro teléfono/tablet usa <b>Exportar</b> e <b>Importar</b>. Para audio en todos los dispositivos, usa un archivo dentro de GitHub Pages o una liga directa.
        </p>
      </div>
    </aside>

    <section class="panel viewer" id="appPanel">
      <div class="panel-inner">
        <div class="grid-3">
          <div>
            <label for="titulo">Título</label>
            <input id="titulo" placeholder="Nombre de la canción" />
          </div>
          <div>
            <label for="artista">Artista / Grupo</label>
            <input id="artista" placeholder="Ariel Camacho, etc." />
          </div>
          <div>
            <label for="tono">Tono base</label>
            <select id="tono">
              <option>C</option><option>C#</option><option>Db</option><option>D</option><option>D#</option><option>Eb</option><option>E</option><option>F</option><option>F#</option><option>Gb</option><option>G</option><option>G#</option><option>Ab</option><option>A</option><option>A#</option><option>Bb</option><option>B</option>
            </select>
          </div>
        </div>

        <div class="grid-2">
          <div>
            <label for="audioUrl">Audio URL / ruta</label>
            <input id="audioUrl" placeholder="audios/mi-rola.mp3 o https://..." />
          </div>
          <div>
            <label for="audioLocal">Audio local para practicar en este dispositivo</label>
            <input id="audioLocal" type="file" accept="audio/*" />
          </div>
        </div>

        <audio id="player" controls></audio>

        <div class="toolbar">
          <button id="btnMenos">-1 tono</button>
          <button id="btnMas">+1 tono</button>
          <button id="btnResetTono">Reset</button>
          <button id="btnVista">Vista / Editar</button>
          <button id="btnFuenteMenos">A-</button>
          <button id="btnFuenteMas">A+</button>
        </div>

        <div class="toolbar">
          <button class="warning" id="btnTele">Teleprompter</button>
          <label style="margin: 0; min-width: 170px; flex: 1;">Velocidad: <span id="velocidadTexto">1</span></label>
          <input id="velocidad" type="range" min="0" max="8" step="1" value="1" style="max-width: 220px;" />
          <button id="btnTop">Arriba</button>
        </div>

        <label for="letra">Letra y acordes</label>
        <textarea id="letra" placeholder="Pega aquí tu rola con acordes. Ejemplo:

[Intro]
G  D  Em  C

G
Aquí va la letra..."></textarea>
      </div>

      <div class="preview hidden" id="preview"></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'mi-cancionero-pro-v2';
 const notas = [
  'C', 'C#', 'D', 'D#', 'E', 'F',
  'F#', 'G', 'G#', 'A', 'A#', 'B'
];

const bemoles = {
  'Db': 'C#',
  'Eb': 'D#',
  'Gb': 'F#',
  'Ab': 'G#',
  'Bb': 'A#',
  'Cb': 'B',
  'Fb': 'E'
};

function normalizarNota(nota) {
  return bemoles[nota] || nota;
}

function normalizarNota(nota) {
  return bemoles[nota] || nota;
}
    const $ = (id) => document.getElementById(id);

    const state = {
      canciones: [],
      actualId: null,
      orden: 'fecha',
      transposicion: 0,
      editando: true,
      teleTimer: null,
      fontSize: 18
    };

    function uid() {
      return 'song-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function setStatus(texto) {
      $('status').textContent = texto;
    }

    function cargarStorage() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        state.canciones = Array.isArray(data) ? data : [];
      } catch {
        state.canciones = [];
      }
    }

    function guardarStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.canciones));
    }

    function cancionActual() {
      return state.canciones.find(c => c.id === state.actualId) || null;
    }

    function leerFormulario() {
      return {
        id: state.actualId || uid(),
        titulo: $('titulo').value.trim() || 'Sin título',
        artista: $('artista').value.trim(),
        tono: $('tono').value,
        audioUrl: $('audioUrl').value.trim(),
        letra: $('letra').value,
        updatedAt: new Date().toISOString()
      };
    }

    function llenarFormulario(cancion) {
      state.actualId = cancion.id;
      state.transposicion = 0;
      $('titulo').value = cancion.titulo || '';
      $('artista').value = cancion.artista || '';
      $('tono').value = cancion.tono || 'C';
      $('audioUrl').value = cancion.audioUrl || '';
      $('letra').value = cancion.letra || '';
      $('audioLocal').value = '';
      actualizarPlayer();
      renderLista();
      renderPreview();
      setStatus('Rola cargada: ' + (cancion.titulo || 'Sin título'));
    }

    function nuevaCancion() {
      state.actualId = null;
      state.transposicion = 0;
      $('titulo').value = '';
      $('artista').value = '';
      $('tono').value = 'C';
      $('audioUrl').value = '';
      $('audioLocal').value = '';
      $('letra').value = '';
      $('player').removeAttribute('src');
      $('player').load();
      renderLista();
      renderPreview();
      setStatus('Nueva rola lista para capturar.');
    }

    function guardarCancion() {
      const nueva = leerFormulario();
      const idx = state.canciones.findIndex(c => c.id === nueva.id);
      if (idx >= 0) state.canciones[idx] = nueva;
      else state.canciones.unshift(nueva);
      state.actualId = nueva.id;
      guardarStorage();
      renderLista();
      renderPreview();
      setStatus('Guardado ✅ ' + nueva.titulo);
    }

    function borrarCancion() {
      const actual = cancionActual();
      if (!actual) {
        setStatus('No hay rola seleccionada para borrar.');
        return;
      }
      const seguro = confirm('¿Borrar "' + actual.titulo + '"?');
      if (!seguro) return;
      state.canciones = state.canciones.filter(c => c.id !== actual.id);
      guardarStorage();
      nuevaCancion();
      setStatus('Rola borrada.');
    }

    function renderLista() {
      const q = $('busqueda').value.trim().toLowerCase();
      let canciones = [...state.canciones].filter(c => {
        const texto = `${c.titulo || ''} ${c.artista || ''} ${c.tono || ''}`.toLowerCase();
        return texto.includes(q);
      });

      if (state.orden === 'titulo') {
        canciones.sort((a, b) => (a.titulo || '').localeCompare(b.titulo || ''));
      } else {
        canciones.sort((a, b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
      }

      const lista = $('listaCanciones');
      lista.innerHTML = '';

      if (!canciones.length) {
        lista.innerHTML = '<div class="small">No hay rolas todavía. Guarda la primera y aquí aparece.</div>';
        return;
      }

      canciones.forEach(c => {
        const card = document.createElement('div');
        card.className = 'song-card' + (c.id === state.actualId ? ' active' : '');
        card.innerHTML = `
          <div class="song-title">${escapeHtml(c.titulo || 'Sin título')}</div>
          <div class="song-meta">${escapeHtml(c.artista || 'Sin artista')} · Tono ${escapeHtml(c.tono || 'C')}</div>
        `;
        card.onclick = () => llenarFormulario(c);
        lista.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function normalizarNota(nota) {
      return equivalentes[nota] || nota;
    }

  function transponerNota(nota, pasos) {
  nota = normalizarNota(nota);

  const index = notas.indexOf(nota);

  if (index === -1) {
    return nota;
  }

  let nuevoIndex = (index + pasos) % 12;

  if (nuevoIndex < 0) {
    nuevoIndex += 12;
  }

  return notas[nuevoIndex];
}

    function transponerAcorde(acorde, pasos) {
      const match = acorde.match(/^([A-G](?:#|b)?)(.*)$/);
      if (!match) return acorde;
      return transponerNota(match[1], pasos) + match[2];
    }

    function procesarLinea(linea) {
      const acordesRegex = /\b([A-G](?:#|b)?(?:maj7|maj|min|m|sus|dim|aug|add)?\d*(?:\/[A-G](?:#|b)?)?)\b/g;
      let segura = escapeHtml(linea);

      segura = segura.replace(/^\s*\[(.+?)\]\s*$/g, '<span class="section-title">[$1]</span>');

      segura = segura.replace(acordesRegex, (full, prefijo, acorde) => {
        let nuevo = acorde;
        if (acorde.includes('/')) {
          const [base, bajo] = acorde.split('/');
          nuevo = transponerAcorde(base, state.transposicion) + '/' + transponerAcorde(bajo, state.transposicion);
        } else {
          nuevo = transponerAcorde(acorde, state.transposicion);
        }
        return prefijo + '<span class="chord">' + nuevo + '</span>';
      });

      return segura;
    }

    function renderPreview() {
      const lineas = $('letra').value.split('\n');
      $('preview').innerHTML = lineas.map(procesarLinea).join('\n');
    }

    function cambiarVista() {
      state.editando = !state.editando;
      $('letra').classList.toggle('hidden', !state.editando);
      $('preview').classList.toggle('hidden', state.editando);
      renderPreview();
      setStatus(state.editando ? 'Modo edición.' : 'Modo vista. Acordes resaltados.');
    }

    function actualizarPlayer() {
      const url = $('audioUrl').value.trim();
      const player = $('player');
      if (url) {
        player.src = url;
        player.load();
      } else if (!player.src) {
        player.removeAttribute('src');
        player.load();
      }
    }

    function exportar() {
      const blob = new Blob([JSON.stringify(state.canciones, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mi-cancionero-backup.json';
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus('Biblioteca exportada.');
    }

    function importarArchivo(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data)) throw new Error('Formato inválido');
          const existentes = new Map(state.canciones.map(c => [c.id, c]));
          data.forEach(c => existentes.set(c.id || uid(), { ...c, id: c.id || uid(), updatedAt: c.updatedAt || new Date().toISOString() }));
          state.canciones = Array.from(existentes.values());
          guardarStorage();
          renderLista();
          setStatus('Importación lista ✅');
        } catch (err) {
          setStatus('No pude importar ese archivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    function iniciarTeleprompter() {
      detenerTeleprompter(false);
      const velocidad = Number($('velocidad').value);
      if (velocidad === 0) {
        setStatus('Teleprompter pausado.');
        return;
      }
      if (state.editando) cambiarVista();
      document.body.classList.add('teleprompter-on');
      const preview = $('preview');
      state.teleTimer = setInterval(() => {
        preview.scrollTop += velocidad * 0.45;
        if (preview.scrollTop + preview.clientHeight >= preview.scrollHeight - 2) {
          detenerTeleprompter();
        }
      }, 35);
      setStatus('Teleprompter corriendo 🎶');
    }

    function detenerTeleprompter(mensaje = true) {
      if (state.teleTimer) clearInterval(state.teleTimer);
      state.teleTimer = null;
      document.body.classList.remove('teleprompter-on');
      if (mensaje) setStatus('Teleprompter detenido.');
    }

    function ajustarFuente(delta) {
      state.fontSize = Math.max(12, Math.min(34, state.fontSize + delta));
      document.documentElement.style.setProperty('--font-size', state.fontSize + 'px');
      setStatus('Tamaño de letra: ' + state.fontSize + 'px');
    }

    function bindEventos() {
      $('btnGuardar').onclick = guardarCancion;
      $('btnNueva').onclick = nuevaCancion;
      $('btnBorrar').onclick = borrarCancion;
      $('btnVista').onclick = cambiarVista;
      $('btnMas').onclick = () => { state.transposicion += 1; renderPreview(); setStatus('Transposición: +' + state.transposicion); };
      $('btnMenos').onclick = () => { state.transposicion -= 1; renderPreview(); setStatus('Transposición: ' + state.transposicion); };
      $('btnResetTono').onclick = () => { state.transposicion = 0; renderPreview(); setStatus('Tono original.'); };
      $('btnFuenteMas').onclick = () => ajustarFuente(2);
      $('btnFuenteMenos').onclick = () => ajustarFuente(-2);
      $('btnTop').onclick = () => { $('preview').scrollTop = 0; $('letra').scrollTop = 0; };
      $('btnTele').onclick = () => state.teleTimer ? detenerTeleprompter() : iniciarTeleprompter();
      $('btnExportar').onclick = exportar;
      $('btnImportar').onclick = () => $('archivoImportar').click();
      $('archivoImportar').onchange = (e) => e.target.files[0] && importarArchivo(e.target.files[0]);
      $('btnOrdenTitulo').onclick = () => { state.orden = 'titulo'; renderLista(); };
      $('btnOrdenFecha').onclick = () => { state.orden = 'fecha'; renderLista(); };
      $('busqueda').oninput = renderLista;
      $('letra').oninput = renderPreview;
      $('audioUrl').onchange = actualizarPlayer;
      $('audioLocal').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        $('player').src = URL.createObjectURL(file);
        $('player').load();
        setStatus('Audio local cargado para practicar.');
      };
      $('velocidad').oninput = () => {
        $('velocidadTexto').textContent = $('velocidad').value;
        if (state.teleTimer) iniciarTeleprompter();
      };

      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') {
          e.preventDefault();
          guardarCancion();
        }
        if (e.key === 'Escape') detenerTeleprompter();
      });
    }

    function demoSiVacio() {
      if (state.canciones.length) return;
      state.canciones.push({
        id: uid(),
        titulo: 'Demo - Te Metiste estilo práctica',
        artista: 'Cancionero',
        tono: 'G',
        audioUrl: '',
        letra: '[Intro]\nG  D  Em  C\n\n[Verso]\nG\nAquí pega tu letra\nD\ny deja los acordes arriba o en la misma línea\nEm\npara poder transportar\nC\ny practicar con teleprompter.\n',
        updatedAt: new Date().toISOString()
      });
      guardarStorage();
    }

    function iniciar() {
      bindEventos();
      cargarStorage();
      demoSiVacio();
      renderLista();
      llenarFormulario(state.canciones[0]);
    }

    iniciar();
  </script>
</body>
</html>
